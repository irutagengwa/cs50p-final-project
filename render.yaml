services:
  - type: web
    name: trendsignal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker: matplotlib + pandas + numpy is ~250MB resident, and the free
    # instance only has 512MB. A second worker OOMs it.
    startCommand: gunicorn project:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
